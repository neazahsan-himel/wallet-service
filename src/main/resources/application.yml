spring:
  application:
    name: wallet-service
  datasource:
    # Local dev values matching docker-compose.yml. Tests override these via @ServiceConnection.
    url: jdbc:postgresql://localhost:5432/wallet
    username: wallet
    password: wallet
  flyway:
    enabled: true
  jackson:
    # Amounts are whole dinars. Without these, 100.5 would be truncated to 100 and "100" coerced to 100.
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  port: 8088

wallet:
  scheduling:
    # Integration tests set this to false and run the jobs by hand.
    enabled: true
  outbox:
    poll-interval: PT1S
    batch-size: 100
    # Must comfortably exceed the time to send one batch, or a slow batch is re-leased and sent twice.
    lease: PT30S
